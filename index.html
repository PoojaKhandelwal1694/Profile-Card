<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css">
    <style>
        *{
            padding: 0;
            margin: 0;
        }
        .con{
            /* border: 1px solid black; */
            width: 80%;
            height: 500px;
            margin: 50px 50px 50px  150px;
            display: flex;
        }
        .box1{
            /* border: 1px solid black; */
            border-radius: 10px;
            background-color: navy;
            width: 2%;
            height: 100%;
            
        }
        .box2{
            /* border: 1px solid black; */
            width: 60%;
            height: 100%;
            font-size: 60px;
            color: navy;
            background-color: aliceblue;
            border-radius: 30px;
            /* word-spacing: 5px; */
            /* letter-spacing: 5px; */
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .box3{
            /* border: 1px solid black; */
            box-shadow: 3px 3px 3px;
            border-radius: 30px;
            width: 38%;
            height: 100%;
        }
        .top{
            width: 100%;
            height: 35%;
            /* border: 1px solid black; */
        }
        .top-in{
            border-top-left-radius: 30px ;
            border-top-right-radius: 30px ;
            width: 100%;
            height: 100%;
            border: 1px solid black;
            display: flex;
            background-color: navy;
            justify-content: center;
            align-items: end;
        }
        .circle{
            position: absolute;
            top: 80px;
            margin-top: 15px;
            height: 18%;
            width: 10%;
            background-color: white;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        img{
            height: 90%;
            width: 90%;
            border-radius: 50%;

        }
        .icon{
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            height: 70px;
        }
        .fa-whatsapp{
            color: green;
            background-color: white;
        }
        .fa-facebook{
            color: blue;
            background-color: white;
            
        }
        .fa-instagram{
            color: rgba(160, 31, 160, 0.69);
            background-color: white;
            
        }
        .fa-github{
            color: black;
            background-color: white;
            
        }
        .fa-facebook{
            color: blue;
            background-color: white;
            
        }
        .fa-linkedin{
            color: rgb(28, 147, 244);
            background-color: white;
            
        }
        .fa-behance{
            color: rgb(3, 29, 3);
            background-color: white;
            
        }
        .button{
            display: flex;
            align-items: center;
            height: 10%;
            justify-content: space-evenly;
            
        }
        .b1{
            height: 100%;
            width: 40%;
            background-color: navy;
            border-radius: 30px;
            line-height: 30px;
            color: white;
            text-align: center;

        }
        .bottom{
            height: 70%;
        }
        h2,h3{
            margin-top: 5%;
        }
    </style>
</head>
<body>
    <div class="con">
        <div class="box1"></div>
        <div class="box2">
            <h1>
                Profile Card UI UX Design
            </h1>
        </div>
        <div class="box3">
            <div class="top">
                <div class="top-in">
                    <div class="circle">
                        <img src="p8.PNG" alt="">
                    </div>
                </div>
            </div>
            <div class="bottom">
                <h2 align="center" class="a">Website Developer</h2>
                <h3 align="center" class="a"> Dezyne Ecole College</h3>
                <h3 align="center" class="a">BCA 2<SUP>nd</SUP> YEAR</h3>
                <div class="icon" class="a">
                    <i class="fa fa-brands fa-2x fa-whatsapp "></i>
                    <i class="fa fa-brands fa-2x fa-facebook "></i>
                    <i class="fa fa-brands fa-2x fa-instagram"></i>
                    <i class="fa fa-brands fa-2x fa-github"></i></a>
                    <i class="fa fa-brands fa-2x fa-linkedin"></i>
                    <i class="fa fa-brands fa-2x fa-behance"></i>
                </div>
                <div class="button">
                    <div class="b1">Subcribe</div>
                    <div class="b1">Message</div>
                </div>
                <div class="icon">
                    <i class="fa fa-solid fa-heart"></i>60.4k
                    <i class="fa fa-solid fa-comment"></i>20k
                    <i class="fa fa-solid fa-share fa-flip-horizontak"></i>12.6k
                </div>
            </div>
        </div>
    </div>
</body>
</html>
